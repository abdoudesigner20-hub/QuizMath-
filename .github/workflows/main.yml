name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Download Cairo font and embed it offline
        run: |
          mkdir -p www/fonts
          curl -L "https://fonts.gstatic.com/s/cairo/v28/SLXGc1nY6HkvalIhTp2mxdt0UX8.woff2" -o www/fonts/cairo-regular.woff2
          curl -L "https://fonts.gstatic.com/s/cairo/v28/SLXVc1nY6Hkvalr-ao6L59lrFYgIABxl.woff2" -o www/fonts/cairo-bold.woff2
          # Create font CSS
          cat > www/fonts/cairo.css << 'EOF'
          @font-face {
            font-family: 'Cairo';
            font-style: normal;
            font-weight: 400;
            src: url('./cairo-regular.woff2') format('woff2');
          }
          @font-face {
            font-family: 'Cairo';
            font-style: normal;
            font-weight: 700 900;
            src: url('./cairo-bold.woff2') format('woff2');
          }
          EOF

      - name: Create www folder and copy files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web files
        run: npx cap sync android

      - name: Create assets folder and copy icon
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png

      - name: Generate icons with @capacitor/assets
        run: npx @capacitor/assets generate --android

      - name: Set Android permissions and WebView settings
        run: |
          # Allow cleartext traffic for font loading fallback
          sed -i 's/android:usesCleartextTraffic="false"/android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuizMath-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
